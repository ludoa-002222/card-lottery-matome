<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a52"/>
      <stop offset="100%" stop-color="#f2712f"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="165" cy="322" rx="86" ry="14" fill="#e0392b" opacity=".12"/>

  <!-- tail -->
  <path d="M248 250c46-6 62-52 40-88-14-23-44-30-60-14 26 4 40 24 34 46-6 22-24 30-14 56z"
        fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M252 178c10 12 8 30-4 40" fill="none" stroke="#fff4e6" stroke-width="6" stroke-linecap="round"/>

  <!-- body -->
  <path d="M96 340c-6-52 6-96 68-96s76 44 70 96z" fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4"/>
  <path d="M126 340c-4-34 2-62 38-62s44 28 40 62z" fill="#fff4e6"/>

  <!-- arm holding card -->
  <g>
    <rect x="196" y="196" width="70" height="94" rx="10" fill="#fffdf8" stroke="#c94f1f" stroke-width="4" transform="rotate(-12 231 243)"/>
    <path d="M212 220l38 8-8 38-38-8z" fill="#f2712f" opacity=".18" transform="rotate(-12 231 243)"/>
    <path d="M226 231l10 10-10 10-10-10z" fill="#e0392b" transform="rotate(-12 231 243)"/>
    <path d="M172 250c14-24 34-38 46-32 10 5 8 20-4 30-14 12-34 14-42 2z" fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4"/>
  </g>
  <path d="M92 258c-16-20-20-42-8-54 9-9 22-6 26 6-10 2-16 12-12 24 4 12 4 18-6 24z" fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4"/>

  <!-- head -->
  <g>
    <path d="M96 118C96 72 128 40 165 40s69 32 69 78c0 46-31 78-69 78s-69-32-69-78z"
          fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4"/>
    <!-- ears -->
    <path d="M100 66L78 8l52 34z" fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M104 54L92 22l30 20z" fill="#fff4e6"/>
    <path d="M230 66l22-58-52 34z" fill="url(#furGrad)" stroke="#c94f1f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M226 54l12-32-30 20z" fill="#fff4e6"/>

    <!-- muzzle patch -->
    <path d="M118 128c8 30 26 46 47 46s39-16 47-46c-14 14-30 20-47 20s-33-6-47-20z" fill="#fff4e6"/>

    <!-- blush -->
    <ellipse cx="118" cy="128" rx="13" ry="8" fill="#ff9a52" opacity=".55"/>
    <ellipse cx="212" cy="128" rx="13" ry="8" fill="#ff9a52" opacity=".55"/>

    <!-- eyes -->
    <ellipse cx="138" cy="108" rx="8" ry="10" fill="#241a12"/>
    <ellipse cx="192" cy="108" rx="8" ry="10" fill="#241a12"/>
    <circle cx="140.5" cy="104" r="2.4" fill="#fff"/>
    <circle cx="194.5" cy="104" r="2.4" fill="#fff"/>

    <!-- nose -->
    <path d="M158 132l7 8 7-8-7-6z" fill="#241a12"/>
  </g>
</svg>
