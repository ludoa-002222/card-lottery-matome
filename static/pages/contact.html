<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜オリパマーケット</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="wrap legal">
  <nav class="breadcrumb"><a href="../index.html">ホーム</a> &gt; お問い合わせ</nav>
  <h1>お問い合わせ</h1>
  <p>掲載情報の誤り・修正依頼や、その他のお問い合わせは以下のフォームからご連絡ください。内容を確認のうえ、担当より順次対応いたします。</p>
  <form class="form-box contact-box" style="text-align:left;">
    <label>お名前<span class="req">必須</span></label>
    <input type="text" disabled>
    <label>メールアドレス<span class="req">必須</span></label>
    <input type="email" disabled>
    <label>お問い合わせ種別</label>
    <select disabled>
      <option>掲載情報の誤り・修正依頼</option>
      <option>店舗・運営者様からのご連絡</option>
      <option>その他のお問い合わせ</option>
    </select>
    <label>お問い合わせ内容<span class="req">必須</span></label>
    <textarea rows="7" disabled></textarea>
    <button type="button" class="btn primary" disabled>送信する（デモ）</button>
  </form>
  <p class="footer-note">当サイトは抽選の実施主体ではありません。抽選への応募・当落・返金に関するお問い合わせは、各店舗の公式ページへご連絡ください。</p>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="../assets/js/common.js"></script>
</body>
</html>
