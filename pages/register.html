<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無料会員登録｜オリパマーケット</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="wrap">
  <nav class="breadcrumb"><a href="../index.html">ホーム</a> &gt; 無料会員登録</nav>
  <div class="form-box">
    <img class="mascot-inline" src="../assets/img/logo-mark.svg" alt="" style="width:48px;">
    <h1 style="font-size:1.2rem;text-align:center;">無料会員登録</h1>
    <p class="footer-note" style="text-align:center;">30秒で登録完了。締切カレンダーの全件表示・新着通知が使えます。</p>
    <label>メールアドレス</label>
    <input type="email" placeholder="you@example.com" disabled>
    <label>パスワード</label>
    <input type="password" placeholder="8文字以上" disabled>
    <button class="btn primary">登録する（デモ）</button>
    <div class="oauth-row">
      <button class="btn">LINEで登録</button>
      <button class="btn">Googleで登録</button>
    </div>
    <p class="footer-note" style="text-align:center;margin-top:14px;">登録済みの方は<a href="mypage.html">ログイン</a></p>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="../assets/js/common.js"></script>
</body>
</html>
