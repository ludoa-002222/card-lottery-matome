<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ｜オリパマーケット</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="wrap">
  <nav class="breadcrumb"><a href="../index.html">ホーム</a> &gt; マイページ</nav>
  <div class="form-box">
    <h1 style="font-size:1.2rem;text-align:center;">ログイン</h1>
    <label>メールアドレス</label>
    <input type="email" placeholder="you@example.com" disabled>
    <label>パスワード</label>
    <input type="password" placeholder="パスワード" disabled>
    <button class="btn primary">ログイン（デモ）</button>
    <div class="oauth-row">
      <button class="btn">LINEでログイン</button>
      <button class="btn">Googleでログイン</button>
    </div>
    <p class="footer-note" style="text-align:center;margin-top:14px;">未登録の方は<a href="register.html">無料会員登録</a></p>
  </div>
  <p class="footer-note" style="text-align:center;">※本デモページでは実際のログイン処理は行われません。</p>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="../assets/js/common.js"></script>
</body>
</html>
